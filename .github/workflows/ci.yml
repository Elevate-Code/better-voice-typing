name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install
        run: uv sync --frozen
      - name: Test
        run: uv run pytest -q
      - name: Build check (PyInstaller)
        run: uv run pyinstaller BetterVoiceTyping.spec --noconfirm
