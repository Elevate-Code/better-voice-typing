[pytest]
# Only tests/*.py are collected. tests/manual/ holds interactive tools and
# tests/setup_test/ holds the PowerShell install/update harness — neither is
# a unit test (see tests/README.md).
testpaths = tests
pythonpath = .
addopts = -ra --ignore=tests/manual --ignore=tests/setup_test
# Every test here exercises threads or timing; a hang is a failure, not a wait.
timeout = 20
